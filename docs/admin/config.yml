# Faithway website editor (Sveltia CMS). Docs: https://github.com/sveltia/sveltia-cms
backend:
  name: github
  repo: thorskii92/faithway-bbc
  branch: main
  # GitHub sign-in helper (Cloudflare Worker "faithway-cms-auth", source: sveltia/sveltia-cms-auth)
  base_url: https://faithway-cms-auth.nestorigna92.workers.dev
  # the repo is public, so ask GitHub only for public-repo access
  auth_scope: public_repo
  commit_messages:
    create: 'Add event: {{slug}}'
    update: 'Update event: {{slug}}'
    delete: 'Delete event: {{slug}}'
    uploadMedia: 'Upload photo: {{path}}'
    deleteMedia: 'Delete photo: {{path}}'

site_url: https://thorskii92.github.io/faithway-bbc/
display_url: https://thorskii92.github.io/faithway-bbc/
logo:
  src: https://thorskii92.github.io/faithway-bbc/logo.jpg

media_folder: content/uploads
public_folder: /content/uploads

collections:
  - name: events
    label: Events
    label_singular: Event
    description: >-
      Church updates and upcoming events. Events dated today or later appear under
      "You're Invited" on the home page. After you save, the website updates in about 2 minutes.
    folder: content/events
    format: yml
    extension: yml
    create: true
    delete: true
    slug: '{{slug}}'
    identifier_field: title
    summary: 'Added {{added}}  ·  {{date}} · {{title}}'
    sortable_fields: [added, date, title]
    fields:
      - { name: title, label: Title, widget: string, hint: 'e.g. "13th Church Anniversary" or "Easter Cantata 2027"' }
      - { name: title_font, label: 'Title font', widget: select, default: elegant, required: false, hint: 'How the title looks on the card, event page and invitation.', options: [{ label: 'Elegant (default)', value: elegant }, { label: 'Classic', value: classic }, { label: 'Inscription (all caps)', value: inscription }, { label: 'Script (handwritten)', value: script }, { label: 'Modern bold', value: modern }] }
      - name: category
        label: Category
        widget: select
        options:
          - { label: Cantata, value: cantata }
          - { label: Anniversary, value: anniversary }
          - { label: Camp, value: camp }
          - { label: Family, value: family }
          - { label: Saturation, value: saturation }
          - { label: Extension Class, value: extension-class }
          - { label: Church Building, value: building }
          - { label: Other, value: other }
      - { name: date, label: Date, widget: datetime, time_format: false, date_format: YYYY-MM-DD, format: YYYY-MM-DD, picker_utc: true }
      - { name: date_label, label: 'Show date as (optional)', widget: string, required: false, hint: 'Only if the exact day is unknown, e.g. "November 2025". Still pick a date above for ordering.' }
      - { name: time, label: 'Time (optional)', widget: string, required: false, hint: 'e.g. "9:00 AM"' }
      - { name: place, label: Place, widget: string, default: 'Faithway Bible Baptist Church, Puerto Princesa City' }
      - { name: summary, label: Summary, widget: text, hint: 'One or two sentences shown on the event card.' }
      - { name: details, label: 'More details (optional)', widget: text, required: false, hint: 'Program, speakers, what to bring, or a short report. Leave a blank line between paragraphs.' }
      - { name: invitation, label: 'Invitation poster (upcoming events)', widget: image, required: false, hint: 'Shown under "You''re Invited" and on the event page.' }
      - name: photos
        label: 'Photos (past events)'
        label_singular: Photo
        widget: list
        required: false
        hint: 'The first photo is the cover. Drag to reorder.'
        field: { name: image, label: Photo, widget: image }
      - { name: sample, label: 'Sample (placeholder) event', widget: boolean, default: false, required: false, hint: 'Shows a grey "Sample" tag. Turn off for real events.' }
      - { name: draft, label: 'Hide from website (draft)', widget: boolean, default: false, required: false }
      - { name: added, label: 'Added on', widget: hidden, required: false }   # set automatically (publish-site fills it from GitHub history)

  - name: verses
    label: Memory Verses
    label_singular: Memory Verse
    description: >-
      Add one verse per week. For a whole month, add each week's verse with its own "Week of" date;
      the website shows each one when its week comes and lists the month's other verses underneath.
    folder: content/verses
    format: yml
    extension: yml
    create: true
    delete: true
    slug: '{{slug}}'
    identifier_field: reference
    summary: 'Added {{added}}  ·  {{week_of}} · {{reference}}'
    sortable_fields: [added, week_of, reference]
    fields:
      - { name: reference, label: Reference, widget: string, hint: 'e.g. "Psalm 119:11" or "Romans 10:9-10"' }
      - { name: text, label: 'Verse (KJV)', widget: text, hint: 'Type the verse exactly as in the King James Bible.' }
      - { name: font, label: 'Verse font', widget: select, default: elegant, required: false, options: [{ label: 'Elegant (default)', value: elegant }, { label: 'Classic', value: classic }, { label: 'Inscription (all caps)', value: inscription }, { label: 'Script (handwritten)', value: script }, { label: 'Modern bold', value: modern }] }
      - { name: week_of, label: 'Week of', widget: datetime, time_format: false, date_format: YYYY-MM-DD, format: YYYY-MM-DD, picker_utc: true, hint: 'Pick the Sunday (or first day) of the week this verse is for.' }
      - { name: note, label: 'Note (optional)', widget: string, required: false, hint: 'e.g. "Sunday School theme: Prayer"' }
      - { name: sample, label: 'Example only', widget: boolean, default: false, required: false, hint: 'Shows an "Example" tag. Turn off for real verses.' }
      - { name: draft, label: 'Hide from website (draft)', widget: boolean, default: false, required: false }
      - { name: added, label: 'Added on', widget: hidden, required: false }   # set automatically (publish-site fills it from GitHub history)

  - name: videos
    label: Videos (Music Ministry)
    label_singular: Video
    description: >-
      Link YouTube or public Facebook videos of cantatas, the Sunday choir and special numbers. Videos stay on YouTube/Facebook,
      so they use no storage. Pick an event to also show the video on that event's page.
    folder: content/videos
    format: yml
    extension: yml
    create: true
    delete: true
    slug: '{{slug}}'
    identifier_field: title
    summary: 'Added {{added}}  ·  {{date}} · {{title}}'
    sortable_fields:
      fields: [added, date, title]
      default: { field: date, direction: descending }   # latest event date on top
    fields:
      - { name: title, label: Title, widget: string, hint: 'e.g. "Easter Cantata – Full Program" or "How Great Thou Art"' }
      - { name: link, label: 'Video link (YouTube or Facebook)', widget: string, hint: 'YouTube: Share → Copy link. Facebook: open the video, click ... → Copy link. Facebook videos must be Public.', pattern: ['(youtu\.be/|youtube\.com/|facebook\.com/|fb\.watch/)', 'Please paste a YouTube or Facebook video link'] }
      - { name: thumbnail, label: 'Thumbnail (optional, for Facebook videos)', widget: image, required: false, hint: 'YouTube videos get their picture automatically. For Facebook, upload a screenshot or photo to show before playing.' }
      - name: type
        label: Type
        widget: select
        options:
          - { label: Cantata, value: cantata }
          - { label: Sunday Choir, value: choir }
          - { label: Special Number, value: special }
          - { label: Congregational Singing, value: congregational }
          - { label: Other, value: other }
      - { name: date, label: Date, widget: datetime, time_format: false, date_format: YYYY-MM-DD, format: YYYY-MM-DD, picker_utc: true, required: false }
      - { name: performers, label: 'Sung by (optional)', widget: string, required: false, hint: 'e.g. "FBBC Choir" or "Youth Ladies Trio"' }
      - { name: event, label: 'Event (optional)', widget: relation, collection: events, value_field: '{{slug}}', search_fields: [title], display_fields: [title], required: false, hint: 'Show this video on an event page, e.g. the cantata.' }
      - { name: description, label: 'Description (optional)', widget: text, required: false }
      - { name: draft, label: 'Hide from website (draft)', widget: boolean, default: false, required: false }
      - { name: added, label: 'Added on', widget: hidden, required: false }   # set automatically (publish-site fills it from GitHub history)

  - name: notices
    label: Announcements
    label_singular: Announcement
    description: >-
      Short notices for the "This week at Faithway" box on the home page, e.g. a schedule change,
      a fellowship lunch or a prayer request. Each one shows only between its "Show from" and "Show until" dates.
    folder: content/notices
    format: yml
    extension: yml
    create: true
    delete: true
    slug: '{{slug}}'
    identifier_field: title
    summary: 'Added {{added}}  ·  {{show_from}} → {{show_until}} · {{title}}'
    sortable_fields:
      fields: [added, show_from, title]
      default: { field: show_from, direction: descending }
    fields:
      - { name: title, label: Title, widget: string, hint: 'e.g. "No afternoon service this Sunday" or "Fellowship lunch after worship"' }
      - { name: text, label: 'Details (optional)', widget: text, required: false, hint: 'One or two sentences.' }
      - { name: show_from, label: 'Show from', widget: datetime, time_format: false, date_format: YYYY-MM-DD, format: YYYY-MM-DD, picker_utc: true }
      - { name: show_until, label: 'Show until', widget: datetime, time_format: false, date_format: YYYY-MM-DD, format: YYYY-MM-DD, picker_utc: true, hint: 'The last day it should appear, e.g. the day of the event.' }
      - { name: link, label: 'Link (optional)', widget: string, required: false, hint: 'A web address to open, e.g. a Google Form or a video.' }
      - { name: link_label, label: 'Link text (optional)', widget: string, required: false, hint: 'e.g. "Sign up" (default: "Learn more")' }
      - { name: draft, label: 'Hide from website (draft)', widget: boolean, default: false, required: false }
      - { name: added, label: 'Added on', widget: hidden, required: false }   # set automatically from GitHub history

  - name: letters
    label: Prayer Letters
    label_singular: Prayer Letter
    description: >-
      Letters from our missionaries, shown on their page on the missions board. Type the letter, upload photos of
      the printed pages, or attach the PDF. Letters are public: leave out anything sensitive (security details, home addresses).
