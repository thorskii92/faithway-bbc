    format: yml
    extension: yml
    create: true
    delete: true
    slug: '{{missionary}}-{{date}}-{{slug}}'
    identifier_field: title
    summary: 'Added {{added}}  ·  {{date}} · No. {{missionary}} · {{title}}'
    sortable_fields:
