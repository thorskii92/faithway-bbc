  - name: settings
    label: Church Info
    description: Contact details shown in the Visit section of the website.
    editor: { preview: false }
    files:
      - name: church
        label: Phone and email
        file: content/settings/church.yml
        fields:
          - { name: phone, label: 'Phone number', widget: string, required: false, hint: 'e.g. "0917 123 4567". Leave empty to hide.' }
          - { name: email, label: Email, widget: string, required: false, hint: 'Leave empty to hide.' }
          - { name: contact_note, label: 'Note (optional)', widget: string, required: false, hint: 'e.g. "Text or call Pastor Sonny"' }
