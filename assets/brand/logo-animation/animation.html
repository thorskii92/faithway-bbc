    // gold only where the blue hasn't reached yet, so no gold edge peeks out behind the blue
    const goldTop = bottom - rp * H, blueTop = bottom - back * H;
    $('roadGoldRect').setAttribute('y', goldTop); $('roadGoldRect').setAttribute('height', Math.max(0, blueTop - goldTop));
    $('roadBlueRect').setAttribute('y', bottom - back * H); $('roadBlueRect').setAttribute('height', back * H);
    $('roadGlow').setAttribute('opacity', (1 - back) * .9);

    // 3. the cross: the stem rises out of the road, then the crossbar opens outward
    const stemH = X.cut - X.top + 4;
    const st = outCubic(k(t, 1.6, .35));
    const revealY = X.cut + 2 - st * stemH;
    $('stemRect').setAttribute('y', revealY); $('stemRect').setAttribute('height', st * stemH);
    // below the crossbar the stem flares into the road: reveal that part at its full width
    const neckTop = Math.max(X.bar[1] + 6, revealY);
    $('neckRect').setAttribute('y', neckTop); $('neckRect').setAttribute('height', Math.max(0, (back >= 1 ? P.road_box[3] + 4 : X.cut + 2) - neckTop));
    const bw = Math.max(0, outBack(k(t, 1.9, .3), 1.6)) * (X.bar_x[1] - X.bar_x[0] + 6);
    const bc = (X.bar_x[0] + X.bar_x[1]) / 2;
    $('barRect').setAttribute('x', bc - bw / 2); $('barRect').setAttribute('width', bw);
    const whole = t >= 2.25;   // after both are complete, show the single traced cross+road (no seam)
    crossroad.setAttribute('opacity', whole ? 1 : 0);
    crossParts.setAttribute('opacity', whole ? 0 : 1);

    // 4. the dove flies in from the top left, flapping, then settles in its place above the cross
    const da = k(t, 2.1, .35), dm = outCubic(k(t, 2.1, .7));
    const settle = k(t, 2.65, .25);
    const bob = Math.sin(Math.max(0, t - 2.1) * 12) * 2.2 * (1 - settle);
    dove.setAttribute('transform', `translate(${(-(1 - dm) * 60).toFixed(2)} ${(-(1 - dm) * 45 + bob).toFixed(2)})`);
    dove.setAttribute('opacity', da);
    const flapping = 1 - k(t, 2.7, .2);
    const phase = Math.max(0, t - 2.1) * (2 * Math.PI / .24);
    const down = flapping * (.5 - .5 * Math.cos(phase));         // 0 = wings up (rest), 1 = wings down
    const [px, py] = [512, 106];
    wingArt.setAttribute('transform', `translate(${px} ${py}) rotate(${(-14 * down).toFixed(2)}) scale(1 ${(1 - .55 * down).toFixed(3)}) translate(${-px} ${-py})`);

    // 5. the circle is drawn left → over the top → right, gold with a sparkle, then redrawn in blue
    const cp = inOutSine(k(t, 2.75, .95));
    const blue = inOutSine(k(t, 3.7, .5));
    $('mGoldPath').setAttribute('stroke-dasharray', `${cp.toFixed(4)} 1`);
    $('mGlowPath').setAttribute('stroke-dasharray', `${cp.toFixed(4)} 1`);
    $('mBluePath').setAttribute('stroke-dasharray', `${blue.toFixed(4)} 1`);
    arcGlow.setAttribute('opacity', (1 - k(t, 3.7, .5)) * .85);
    const tipA = A0 + cp * (A1 - A0);
    const [tx, ty] = pt(tipA);
    const sparkOn = cp > 0 && cp < 1;
    const burst = k(t, 3.7, .35);
    sparkle.setAttribute('transform', `translate(${tx.toFixed(1)} ${ty.toFixed(1)}) rotate(${(t * 260) % 360}) scale(${(sparkOn ? .75 + .25 * Math.sin(t * 26) : 1 + burst * 1.4).toFixed(3)})`);
    sparkle.setAttribute('opacity', sparkOn ? 1 : (t > 3.7 ? 1 - burst : 0));
    glitter.forEach((c, i) => {
      const a = tipA - ((i + 1) * 4.9 + rnd(i) * 2.3);
      const rr = C.r + (rnd(i + 20) - .5) * 26;
      c.setAttribute('cx', (C.cx + rr * Math.cos(rad(a))).toFixed(1));
      c.setAttribute('cy', (C.cy + rr * Math.sin(rad(a)) + i * .6).toFixed(1));
      c.setAttribute('r', ((1.4 + rnd(i + 40) * 2.6) * (1 - i / 16)).toFixed(2));
      c.setAttribute('fill', i % 3 ? '#F7C64E' : '#FFFFFF');
      c.setAttribute('opacity', (sparkOn && a > A0 ? 1 : 0) * (1 - i / 14) * (.6 + .4 * Math.sin(t * 30 + i)));
    });

    // 6. short pause: the mark is complete in its original colours by 4.2s

    // 7. the church name enters as one: Palawan / FAITHWAY / BIBLE BAPTIST CHURCH, Inc.
    const q = outCubic(k(t, 4.4, .7));
    words.forEach((w) => {
      w.setAttribute('opacity', q.toFixed(3));
      w.setAttribute('transform', `translate(0 ${((1 - q) * 18).toFixed(2)})`);
    });

    // 8. EST. 2013 pops in with the name
    const ep = k(t, 4.6, .45);
    est.setAttribute('opacity', clamp(ep * 3));
    est.setAttribute('transform', `translate(${estC[0]} ${estC[1]}) scale(${Math.max(0, outBack(ep, 2.2)).toFixed(3)}) translate(${-estC[0]} ${-estC[1]})`);

    // 9. the tagline fades in
    const tf = inOutSine(k(t, 4.95, .8));
    letters.forEach((L) => {
      L.setAttribute('stroke-opacity', 0);
      L.setAttribute('fill-opacity', tf.toFixed(3));
      L.setAttribute('transform', `translate(0 ${((1 - tf) * 6).toFixed(2)})`);
    });
  }

  window.DURATION = DURATION;
  window.renderAt = renderAt;
  window.ready = Promise.resolve().then(() => renderAt(0));
  // live looping preview when opened in a browser; the recorder calls renderAt() itself
  if (!/[?&](capture|raw)/.test(location.search)) {
    const start = performance.now();
    const loop = (now) => { renderAt(((now - start) / 1000) % (DURATION + 1.5)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
