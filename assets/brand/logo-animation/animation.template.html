<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Faithway Logo Animation</title>
<style>
  html, body { margin: 0; background: #FFFFFF; }
  body { display: grid; place-items: center; min-height: 100vh; }
  svg { width: min(100vw, 100vh); height: min(100vw, 100vh); display: block; }
</style>
</head>
<body>
<!--
  Faithway Bible Baptist Church logo animation.
  Every shape (book, road, cross, dove, circle and all lettering) is traced from the original
  artwork assets/brand/logo-full.jpg by trace_logo.py, so the finished frame matches the logo.
  Generated by build_animation.mjs from this template + logo-parts.json. Do not edit animation.html.
  Sequence: book opens → road swipes up in gold, then back to blue → cross → dove flaps in →
  circle drawn left to right with a sparkle (Disney style) → pause → church name and EST. 2013
  enter together → tagline fades in → hold. 8 seconds, for video intros/outros.
  window.renderAt(seconds) draws any moment; render.cjs records it to MP4/GIF.
-->
<svg id="s" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#FFE7A3"/><stop offset="1" stop-color="#F2C14E" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="roadGoldClip"><rect id="roadGoldRect" x="420" width="190" y="470" height="0"/></clipPath>
    <clipPath id="roadBlueClip"><rect id="roadBlueRect" x="420" width="190" y="470" height="0"/></clipPath>
    <clipPath id="stemClip"><rect id="stemRect" height="0"/></clipPath>
    <clipPath id="barClip"><rect id="barRect" width="0"/></clipPath>
    <clipPath id="wingClip"><polygon points="480,74 523,74 523,99 513,104 503,111 495,116 480,117"/></clipPath>
    <clipPath id="bodyClip"><polygon points="480,117 495,116 503,111 513,104 523,99 523,74 548,74 548,142 480,142"/></clipPath>
    <mask id="mGold" maskUnits="userSpaceOnUse" x="-100" y="-100" width="1200" height="1200"><path id="mGoldPath" fill="none" stroke="#fff" stroke-width="26" pathLength="1"/></mask>
    <mask id="mGlow" maskUnits="userSpaceOnUse" x="-100" y="-100" width="1200" height="1200"><path id="mGlowPath" fill="none" stroke="#fff" stroke-width="60" pathLength="1"/></mask>
    <mask id="mBlue" maskUnits="userSpaceOnUse" x="-100" y="-100" width="1200" height="1200"><path id="mBluePath" fill="none" stroke="#fff" stroke-width="26" pathLength="1"/></mask>
  </defs>
  <rect width="1000" height="1000" fill="#FFFFFF"/>
  <g id="art"></g>
</svg>

<script>
const PARTS = __PARTS__;
(() => {
  const BLUE = '#55718B', GOLD = '#E8B53C', GRAY = '#454545';
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (parent) parent.appendChild(e); return e; };
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const k = (t, a, d) => clamp((t - a) / d);
  const outCubic = (x) => 1 - Math.pow(1 - x, 3);
  const inOutCubic = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const inOutSine = (x) => -(Math.cos(Math.PI * x) - 1) / 2;
  const outBack = (x, s = 1.9) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
  const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const P = PARTS, C = P.circle, X = P.cross_info, SP = P.spine;

  /* ---------- build the scene from the traced parts ---------- */
  // ?raw keeps the original layout (used to compare against logo-full.jpg); otherwise centre in the frame
  const art = $('art');
  if (!/[?&]raw/.test(location.search)) art.setAttribute('transform', 'translate(-28 38)');

  const book = el('g', { fill: BLUE }, art);
  const pages = P.book.map((b) => el('path', { d: b.d }, book));
  // inner pages are the halves nearest the spine (larger top), outer covers sit lower
  const isInner = P.book.map((b) => b.box[1] < 295);

  el('path', { id: 'roadGlow', d: P.road, fill: '#F7C64E', filter: 'url(#glow)', 'clip-path': 'url(#roadGoldClip)' }, art);
  el('path', { d: P.road, fill: GOLD, 'clip-path': 'url(#roadGoldClip)' }, art);
  el('path', { d: P.road, fill: BLUE, 'clip-path': 'url(#roadBlueClip)' }, art);
  const crossParts = el('g', { fill: BLUE }, art);
  el('path', { d: P.cross, 'clip-path': 'url(#stemClip)' }, crossParts);
  el('path', { d: P.cross, 'clip-path': 'url(#barClip)' }, crossParts);
  const crossroad = el('path', { d: P.crossroad, fill: BLUE, opacity: 0 }, art);
  $('stemRect').setAttribute('x', X.stem[0] - .6); $('stemRect').setAttribute('width', X.stem[1] - X.stem[0] + 1.2);
  $('barRect').setAttribute('y', X.bar[0] - 3); $('barRect').setAttribute('height', X.bar[1] - X.bar[0] + 6);

  // circle: the traced arcs are revealed by a stroke running along the circle's centre line
  const rad = (a) => a * Math.PI / 180;
  const pt = (a) => [C.cx + C.r * Math.cos(rad(a)), C.cy + C.r * Math.sin(rad(a))];
  const A0 = C.left[0] - 2, A1 = C.right[1] + 2;
  const [x0, y0] = pt(A0), [xm, ym] = pt(270), [x1, y1] = pt(A1);
  const centreLine = `M${x0} ${y0} A${C.r} ${C.r} 0 0 1 ${xm} ${ym} A${C.r} ${C.r} 0 0 1 ${x1} ${y1}`;
  for (const id of ['mGoldPath', 'mGlowPath', 'mBluePath']) { $(id).setAttribute('d', centreLine); $(id).setAttribute('stroke-dasharray', '0 1'); }
  const arcs = (fill, mask, extra = {}) => { const g = el('g', { fill, mask: `url(#${mask})`, ...extra }, art); el('path', { d: P.arcL }, g); el('path', { d: P.arcR }, g); return g; };
  const arcGlow = arcs('#F7C64E', 'mGlow', { filter: 'url(#glow)' });
  arcs(GOLD, 'mGold');
  arcs(BLUE, 'mBlue');
  const glitterG = el('g', {}, art);
  const glitter = Array.from({ length: 14 }, () => el('circle', {}, glitterG));
  const sparkle = el('g', {}, art);
  el('circle', { r: 26, fill: 'url(#spark)' }, sparkle);
  el('path', { d: 'M0 -24 L4 -4 L24 0 L4 4 L0 24 L-4 4 L-24 0 L-4 -4 Z', fill: '#FFFFFF' }, sparkle);
  el('path', { d: 'M0 -12 L2 -2 L12 0 L2 2 L0 12 L-2 2 L-12 0 L-2 -2 Z', fill: '#FFE7A3', transform: 'rotate(45)' }, sparkle);

  // dove: white silhouette + traced line art, split into body and wings so the wings can flap
  const dove = el('g', {}, art);
  el('path', { d: P.dove_fill, fill: '#FFFFFF' }, dove);
  el('path', { d: P.dove, fill: BLUE, 'clip-path': 'url(#bodyClip)' }, dove);
  const wings = el('g', { 'clip-path': 'url(#wingClip)' }, dove);
  const wingArt = el('g', {}, wings);
  el('path', { d: P.dove_fill, fill: '#FFFFFF' }, wingArt);
  el('path', { d: P.dove, fill: BLUE }, wingArt);

  // lettering
  const T = Object.fromEntries(P.text.map((t) => [t.name, t]));
  const words = [];
  for (const name of ['palawan', 'faithway', 'church']) {
    for (const w of T[name].words) words.push(el('path', { d: w.d, fill: BLUE, opacity: 0 }, art));
  }
  const est = el('g', { fill: GRAY, opacity: 0 }, art);
  T.est.words.forEach((w) => el('path', { d: w.d }, est));
  const estC = [(T.est.x0 + T.est.x1) / 2, (T.est.y0 + T.est.y1) / 2];
  const letters = T.tagline.letters.map((L) => el('path', { d: L.d, fill: BLUE, 'fill-opacity': 0, stroke: BLUE, 'stroke-width': 1.3, 'stroke-linejoin': 'round', pathLength: 1, 'stroke-dasharray': '1 1', 'stroke-dashoffset': 1, 'stroke-opacity': 0 }, art));

  /* ---------- the timeline (seconds): 8-second version for video intros/outros ----------
     0.15–2.25  book opens, road swipes up in gold → blue, cross rises
     2.10–2.85  dove flies in flapping
     2.75–4.20  circle drawn in gold with a sparkle, then redrawn in blue
     4.40–5.25  church name + EST. 2013 enter together (one entrance)
     4.95–5.75  tagline fades in
     5.75–8.00  hold on the finished logo */
  const DURATION = 8.0;
  const dove0 = [(P.dove_box[0] + P.dove_box[2]) / 2, (P.dove_box[1] + P.dove_box[3]) / 2];
  function renderAt(t) {
    // 1. the book opens from the spine: inner pages first, then the outer covers
    book.setAttribute('opacity', k(t, .15, .2));
    pages.forEach((p, i) => {
      const s = outBack(k(t, isInner[i] ? .22 : .32, .8), 1.1);
      p.setAttribute('transform', `translate(${SP} 0) scale(${Math.max(.02, s)} ${.9 + .1 * Math.min(1, s)}) translate(${-SP} 0)`);
    });

    // 2. the road swipes up in gold, then the blue refills it from the bottom
    const top = P.road_box[1] - 2, bottom = P.road_box[3] + 2, H = bottom - top;
    const rp = inOutCubic(k(t, 1.05, .5)), back = inOutCubic(k(t, 1.7, .45));
    $('roadGoldRect').setAttribute('y', bottom - rp * H); $('roadGoldRect').setAttribute('height', rp * H);
    $('roadBlueRect').setAttribute('y', bottom - back * H); $('roadBlueRect').setAttribute('height', back * H);
    $('roadGlow').setAttribute('opacity', (1 - back) * .9);

    // 3. the cross: the stem rises out of the road, then the crossbar opens outward
    const stemH = X.cut - X.top + 4;
    const st = outCubic(k(t, 1.6, .35));
    $('stemRect').setAttribute('y', X.cut + 2 - st * stemH); $('stemRect').setAttribute('height', st * stemH);
    const bw = Math.max(0, outBack(k(t, 1.9, .3), 1.6)) * (X.bar_x[1] - X.bar_x[0] + 6);
    const bc = (X.bar_x[0] + X.bar_x[1]) / 2;
    $('barRect').setAttribute('x', bc - bw / 2); $('barRect').setAttribute('width', bw);
    const whole = t >= 2.25;   // after both are complete, show the single traced cross+road (no seam)
    crossroad.setAttribute('opacity', whole ? 1 : 0);
    crossParts.setAttribute('opacity', whole ? 0 : 1);

    // 4. the dove flies in from the top left, flapping, then settles in its place above the cross
    const da = k(t, 2.1, .35), dm = outCubic(k(t, 2.1, .7));
    const settle = k(t, 2.65, .25);
    const bob = Math.sin(Math.max(0, t - 2.1) * 12) * 2.2 * (1 - settle);
    dove.setAttribute('transform', `translate(${(-(1 - dm) * 60).toFixed(2)} ${(-(1 - dm) * 45 + bob).toFixed(2)})`);
    dove.setAttribute('opacity', da);
    const flapping = 1 - k(t, 2.7, .2);
    const phase = Math.max(0, t - 2.1) * (2 * Math.PI / .24);
    const down = flapping * (.5 - .5 * Math.cos(phase));         // 0 = wings up (rest), 1 = wings down
    const [px, py] = [512, 106];
    wingArt.setAttribute('transform', `translate(${px} ${py}) rotate(${(-14 * down).toFixed(2)}) scale(1 ${(1 - .55 * down).toFixed(3)}) translate(${-px} ${-py})`);

    // 5. the circle is drawn left → over the top → right, gold with a sparkle, then redrawn in blue
    const cp = inOutSine(k(t, 2.75, .95));
    const blue = inOutSine(k(t, 3.7, .5));
    $('mGoldPath').setAttribute('stroke-dasharray', `${cp.toFixed(4)} 1`);
    $('mGlowPath').setAttribute('stroke-dasharray', `${cp.toFixed(4)} 1`);
    $('mBluePath').setAttribute('stroke-dasharray', `${blue.toFixed(4)} 1`);
    arcGlow.setAttribute('opacity', (1 - k(t, 3.7, .5)) * .85);
    const tipA = A0 + cp * (A1 - A0);
    const [tx, ty] = pt(tipA);
    const sparkOn = cp > 0 && cp < 1;
    const burst = k(t, 3.7, .35);
    sparkle.setAttribute('transform', `translate(${tx.toFixed(1)} ${ty.toFixed(1)}) rotate(${(t * 260) % 360}) scale(${(sparkOn ? .75 + .25 * Math.sin(t * 26) : 1 + burst * 1.4).toFixed(3)})`);
    sparkle.setAttribute('opacity', sparkOn ? 1 : (t > 3.7 ? 1 - burst : 0));
    glitter.forEach((c, i) => {
      const a = tipA - ((i + 1) * 4.9 + rnd(i) * 2.3);
      const rr = C.r + (rnd(i + 20) - .5) * 26;
      c.setAttribute('cx', (C.cx + rr * Math.cos(rad(a))).toFixed(1));
      c.setAttribute('cy', (C.cy + rr * Math.sin(rad(a)) + i * .6).toFixed(1));
      c.setAttribute('r', ((1.4 + rnd(i + 40) * 2.6) * (1 - i / 16)).toFixed(2));
      c.setAttribute('fill', i % 3 ? '#F7C64E' : '#FFFFFF');
      c.setAttribute('opacity', (sparkOn && a > A0 ? 1 : 0) * (1 - i / 14) * (.6 + .4 * Math.sin(t * 30 + i)));
    });

    // 6. short pause: the mark is complete in its original colours by 4.2s

    // 7. the church name enters as one: Palawan / FAITHWAY / BIBLE BAPTIST CHURCH, Inc.
    const q = outCubic(k(t, 4.4, .7));
    words.forEach((w) => {
      w.setAttribute('opacity', q.toFixed(3));
      w.setAttribute('transform', `translate(0 ${((1 - q) * 18).toFixed(2)})`);
    });

    // 8. EST. 2013 pops in with the name
    const ep = k(t, 4.6, .45);
    est.setAttribute('opacity', clamp(ep * 3));
    est.setAttribute('transform', `translate(${estC[0]} ${estC[1]}) scale(${Math.max(0, outBack(ep, 2.2)).toFixed(3)}) translate(${-estC[0]} ${-estC[1]})`);

    // 9. the tagline fades in
    const tf = inOutSine(k(t, 4.95, .8));
    letters.forEach((L) => {
      L.setAttribute('stroke-opacity', 0);
      L.setAttribute('fill-opacity', tf.toFixed(3));
      L.setAttribute('transform', `translate(0 ${((1 - tf) * 6).toFixed(2)})`);
    });
  }

  window.DURATION = DURATION;
  window.renderAt = renderAt;
  window.ready = Promise.resolve().then(() => renderAt(0));
  // live looping preview when opened in a browser; the recorder calls renderAt() itself
  if (!/[?&](capture|raw)/.test(location.search)) {
    const start = performance.now();
    const loop = (now) => { renderAt(((now - start) / 1000) % (DURATION + 1.5)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
