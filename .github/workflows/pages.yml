# Runs when the /admin editor saves an event (changes under content/):
# resizes the uploaded photos, rebuilds docs/events.json, commits the result to main
# and asks GitHub Pages (which publishes main:/docs) to rebuild.
name: Build events and verses

on:
  push:
    branches: [main]
    paths: ['content/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-events
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build events and photos
        run: node scripts/build-events.mjs docs && node scripts/build-verses.mjs docs
      - name: Commit the built files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/events.json docs/verses.json docs/img/events
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Build events from the editor"
          git push
      - name: Republish the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
