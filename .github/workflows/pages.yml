# Runs when the /admin editor saves an event (changes under content/):
# resizes the uploaded photos, rebuilds docs/events.json, commits the result to main
# and asks GitHub Pages (which publishes main:/docs) to rebuild.
name: Build editor content

on:
  push:
    branches: [main]
    paths: ['content/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-events
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history, so added dates come from the first commit
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fill in added dates
        run: node scripts/fill-added.mjs
      - name: Build events and photos
        run: node scripts/build-events.mjs docs && node scripts/build-verses.mjs docs && node scripts/build-videos.mjs docs && node scripts/build-extras.mjs docs
      - name: Commit the built files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content docs
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Build events from the editor"
          git push
      - name: Republish the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
